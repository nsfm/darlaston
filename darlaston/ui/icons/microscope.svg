<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- A compound microscope for the presentation's magnification
       reading: eyepiece and tube down to the stage, the arm curving to
       the base. Drawn at the family's weight; it is read beside a
       number, not instead of one. -->
