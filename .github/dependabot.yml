# Upgrades arrive as pull requests, one dependency at a time, with the
# suite and the Windows camera job run against each. Nothing moves
# underneath a release on its own; see the pins in pyproject.toml.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
