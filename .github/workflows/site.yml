name: site

# Two deploys per release, each for its own reason. The push deploy gets
# site changes live in minutes, ungated by the artifact matrix. The
# workflow_run deploy fires when the artifacts workflow completes, which
# is the earliest moment the new release exists to be baked in -- it
# cannot be `on: release: published`, because releases created with the
# workflow GITHUB_TOKEN never trigger other workflows. Between the two,
# the baked release tracks reality by itself and the page needs no
# client-side API call. In the gap before the re-bake, the links name
# the previous release, which still exists: stale for minutes, never 404.
#
# Pull requests only build when they touch the site, and never deploy:
# an app PR has no business ringing this bell, and a site PR proves it
# compiles without shipping anything.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_run:
    workflows: [artifacts]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Deploys land in commit order; a superseded PR build is wasted work.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The whole downloads section renders from this file; there is no
      # client-side API call. The committed placeholder is `null`, which
      # renders as a link to the releases page -- the truth until the
      # first release ever, and for local builds.
      - name: Bake the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/latest" \
            > src/release-snapshot.json || echo 'null' > src/release-snapshot.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
