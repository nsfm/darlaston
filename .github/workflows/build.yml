name: artifacts

# Builds something a microscopist can actually run, on all three platforms.
#
# `pip install` is a developer distribution and the users are not
# developers, so every push produces a downloadable build, and every push
# to main is a release with a tag of its own. Nobody types a version:
# packaging/version.py walks the history and counts [MAJOR] and [MINOR]
# markers. The builds are also *smoke tested* on the machine
# that made them: an artifact that was never started is a file, not a
# program, and the failure modes here (a missing Qt plugin, a data file
# left out of the bundle) all look like a clean build and a dead launch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only. A superseded PR build is genuinely wasted work, but
  # a build on main or a tag is the thing being released, and cancelling it
  # because something else landed a minute later is how a tag ends up with
  # no artifacts attached to it.
  #
  # Not theoretical: macos-13 is the last Intel image and is scarce enough
  # to sit queued for longer than the other three take to finish, so every
  # push killed it before it started. Four runs, four cancellations, and
  # the Intel build was never once the thing that failed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write        # the release job pushes a tag and a release

jobs:
  # What this commit is called, worked out from the whole history behind it
  # by packaging/version.py -- every commit has its own version and no two
  # share one. Decided before anything is built so the artifacts carry it
  # in their filenames rather than a development string with a hash in it.
  # The tag itself is created at the end, once every platform has built and
  # started: a tag pointing at a release that failed is worse than no tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pick
        run: |
          VERSION=$(python packaging/version.py --bare --explain)
          echo "this commit is $VERSION"
          # Only main releases. A pull request still builds, so the
          # artifacts can be downloaded and tried, but it does not tag.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      # Empty on a pull request, where setuptools-scm's own development
      # version is the honest answer.
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          # Apple silicon only. PySide6 publishes separate arm64 and
          # x86_64 wheels rather than a universal2 one, so one build can
          # only ever serve one architecture, and Intel would need its own
          # matrix leg on macos-13.
          #
          # It is left out because macos-13 is the last Intel image and is
          # scarce: it queued for over an hour while the other three
          # finished in six minutes. The release job waits on the whole
          # matrix, so one slow runner gates every release there will ever
          # be -- and Nate owns the Intel Mac and can build it in one
          # command when it is worth having:
          #
          #     pyinstaller --noconfirm --distpath dist/pyi \
          #         --workpath build/pyi packaging/darlaston.spec
          #     python packaging/bundle.py --label macos-x86_64
          #
          # Nothing platform-specific was dropped, only the runner. Put the
          # leg back if Intel users turn up and the queue improves.
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm reads tags, and a shallow clone has none, which
          # silently produces version 0.1.dev1 for every build ever made.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon-x11-0 fuse libfuse2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[package]"

      - name: Version
        id: version
        shell: bash
        run: |
          python -c "from darlaston import __version__ as v; print(v)"
          echo "value=$(python -c 'from darlaston import __version__ as v; print(v)')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pyinstaller --noconfirm --distpath dist/pyi --workpath build/pyi packaging/darlaston.spec

      # The build is not the deliverable; a program that starts is. Run the
      # frozen binary and make it prove it can reach its own resources.
      - name: Smoke test the frozen build
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke.py

      - name: Package
        id: package
        shell: bash
        run: python packaging/bundle.py --label "${{ matrix.label }}"

      # And again on the finished artifact. The wrapping is its own chance
      # to lose something -- a broken AppRun, a disk image built from a
      # staging directory missing a symlink, a zip written with the wrong
      # root -- and every one of those leaves the directory build intact.
      - name: Smoke test the packaged artifact
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke.py --packaged

      - uses: actions/upload-artifact@v4
        with:
          name: darlaston-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  # Rolling: every push to main is a release, tag and all, named for the
  # commit it was built from.
  release:
    name: release
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Not inherited from the build jobs: this one runs on a fresh runner,
      # where `python` is not necessarily on PATH even though `python3` is.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Tag it
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Idempotent: a re-run of a workflow whose tag already exists
          # should attach to it rather than fall over.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
      - name: Notes
        run: |
          python packaging/notes.py | tee NOTES.md
          echo "--- attaching ---"
          ls -lh incoming/*/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: incoming/*/*
          body_path: NOTES.md
          fail_on_unmatched_files: true
