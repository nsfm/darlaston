name: artifacts

# Builds something a microscopist can actually run, on all three platforms.
#
# `pip install` is a developer distribution and the users are not
# developers, so every push produces a downloadable build and every tag
# produces a release. The builds are also *smoke tested* on the machine
# that made them: an artifact that was never started is a file, not a
# program, and the failure modes here (a missing Qt plugin, a data file
# left out of the bundle) all look like a clean build and a dead launch.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # only used by the release job, on a tag

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          # Two macOS runners, not one. PySide6 publishes separate arm64
          # and x86_64 wheels rather than a universal2 one, so a single
          # build can only ever serve one architecture. macos-14 and later
          # are Apple silicon; macos-13 is the last Intel image.
          - os: macos-14
            label: macos-arm64
          - os: macos-13
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm reads tags, and a shallow clone has none, which
          # silently produces version 0.1.dev1 for every build ever made.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon-x11-0 fuse libfuse2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[package]"

      - name: Version
        id: version
        shell: bash
        run: |
          python -c "from darlaston import __version__ as v; print(v)"
          echo "value=$(python -c 'from darlaston import __version__ as v; print(v)')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pyinstaller --noconfirm --distpath dist/pyi --workpath build/pyi packaging/darlaston.spec

      # The build is not the deliverable; a program that starts is. Run the
      # frozen binary and make it prove it can reach its own resources.
      - name: Smoke test the frozen build
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke.py

      - name: Package
        id: package
        shell: bash
        run: python packaging/bundle.py --label "${{ matrix.label }}"

      # And again on the finished artifact. The wrapping is its own chance
      # to lose something -- a broken AppRun, a disk image built from a
      # staging directory missing a symlink, a zip written with the wrong
      # root -- and every one of those leaves the directory build intact.
      - name: Smoke test the packaged artifact
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke.py --packaged

      - uses: actions/upload-artifact@v4
        with:
          name: darlaston-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Not inherited from the build jobs: this one runs on a fresh runner,
      # where `python` is not necessarily on PATH even though `python3` is.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Notes
        run: |
          python packaging/notes.py | tee NOTES.md
          echo "--- attaching ---"
          ls -lh incoming/*/*
      - uses: softprops/action-gh-release@v2
        with:
          files: incoming/*/*
          body_path: NOTES.md
          draft: true          # a human looks before strangers download it
          fail_on_unmatched_files: true
