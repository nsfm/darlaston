name: intel probe

# Round two. Round one established: Rosetta runs on macos-14-arm64, and
# actions/setup-python with architecture x64 hands over a *universal2*
# binary -- which defaults to arm64 when run, so pip fetched arm64 wheels
# and nothing was cross-anything.
#
# A universal2 binary can be forced to its other half. `arch -x86_64
# python` should report x86_64, pull x86_64 wheels, and drive an x86_64
# PyInstaller to an x86_64 bundle -- no Intel runner anywhere.
#
# This runs the whole thing, and `file` on the result is the verdict.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Which half are we running
        run: |
          echo "native:  $(python -c 'import platform; print(platform.machine())')"
          echo "rosetta: $(arch -x86_64 python -c 'import platform; print(platform.machine())')"

      - name: Build an x86_64 environment under Rosetta
        run: |
          arch -x86_64 python -m venv .venv-x64
          arch -x86_64 ./.venv-x64/bin/python -c \
            "import platform; print('venv reports', platform.machine())"
          arch -x86_64 ./.venv-x64/bin/python -m pip install --upgrade pip
          arch -x86_64 ./.venv-x64/bin/python -m pip install -e ".[package]"

      - name: What did pip actually fetch
        run: |
          arch -x86_64 ./.venv-x64/bin/python - <<'PY'
          import platform, cv2, numpy
          from PySide6 import QtCore
          print("machine:", platform.machine())
          print("numpy", numpy.__version__, "cv2", cv2.__version__,
                "Qt", QtCore.qVersion())
          print("cv2 from:", cv2.__file__)
          PY
          file .venv-x64/lib/python3.12/site-packages/cv2/*.so | head -2 || true

      - name: Build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"
        run: |
          arch -x86_64 ./.venv-x64/bin/pyinstaller --noconfirm \
            --distpath dist/pyi --workpath build/pyi packaging/darlaston.spec

      - name: Is the result actually Intel
        run: |
          BIN=dist/pyi/darlaston.app/Contents/MacOS/darlaston
          file "$BIN"
          echo "--- and does it run, under Rosetta? ---"
          QT_QPA_PLATFORM=offscreen "$BIN" --selftest
