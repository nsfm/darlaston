name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite builds and grabs real widgets and pushes real frames through
    # the pipeline, so it is minutes rather than seconds. This is a guard
    # against a hang burning the default six hours, not a target.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. The floor is the promise in
        # pyproject.toml, so it has to be tested or it is not a promise.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 ships its own Qt, but Qt still dynamically links a handful
      # of system libraries that a CI image does not carry. Without these
      # the offscreen platform plugin fails to load and every widget test
      # dies with a message that does not mention any of them.
      #
      # glib is deliberately not named here even though Qt uses it: Ubuntu
      # 24.04 renamed the package to libglib2.0-0t64, so naming it pins the
      # workflow to a runner image, and it is in the base image regardless.
      - name: System libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        # One pass, deliberately. The suite forks across cores in about
        # half the time (`make test-fast`), and it fails roughly one run
        # in three or four while doing it -- a different test each time,
        # and every one investigated so far was starvation rather than a
        # defect. A build that goes red at random teaches people to press
        # re-run, which is worse than a slow one.
        run: pytest -q

  # The Windows camera backend, against a real DirectShow device. There
  # is no camera on a hosted runner, so one is registered: the OBS
  # virtual camera module, fed from Python by pyvirtualcam. Chosen over
  # Unity Capture after a week of evidence in one afternoon: our own
  # enumeration described Unity Capture perfectly and OpenCV's
  # DirectShow open then refused it on both 4.x and 5.x for no reason
  # it would give, while OpenCV carries code written for the OBS camera
  # by name (NV12 forced, since 4.8.0). It shows up to enumeration with
  # three formats at 1920x1080 and no camera controls, which is exactly
  # the shape of device the backend has to describe honestly. (Before
  # the pins, this job ran on both OpenCV majors and both passed.)
  #
  # The full suite does not run here yet: a handful of tests import the
  # V4L2 module, which imports fcntl, which Windows has not got. The
  # platform-neutral camera tests run, then the virtual-camera ones.
  wincam:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OBS_ZIP_SHA256: CF9D26319A8533460070E7C476818158563B6810A903774A88FA608BF748499B
      OBS_DLL_SHA256: 864725C9AAA6966C232EDEE4F7E686DAF5930D72675F3F0AB94EBA9C4DAA2BC8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64          # the module is 64-bit
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyvirtualcam==0.15.0
          python -c "import cv2; print('cv2', cv2.__version__)"
      # The server image may ship without the media stack OpenCV's
      # DirectShow capture graph is built on. Ask for it; say whether
      # it came. The probe below reports what is actually present.
      - name: Media Foundation feature
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            $f = Get-WindowsFeature Server-Media-Foundation -ErrorAction Stop
            "before: $($f.InstallState)"
            if ($f.InstallState -ne 'Installed') {
              $r = Install-WindowsFeature Server-Media-Foundation -ErrorAction Stop
              "install: success=$($r.Success) restart=$($r.RestartNeeded)"
            }
          } catch { "feature query failed: $_" }
      # Only the module and its placeholder picture come out of the
      # 100 MB release archive; OBS itself is not installed. The module
      # imports nothing but system DLLs and registers on its own.
      - name: Register the OBS virtual camera
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\obs.zip"
          Invoke-WebRequest https://github.com/obsproject/obs-studio/releases/download/26.1.1/OBS-Studio-26.1.1-Full-x64.zip -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne $env:OBS_ZIP_SHA256) { throw 'zip hash mismatch' }
          $dst = "$env:RUNNER_TEMP\obsvcam"; New-Item -ItemType Directory $dst | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip)
          foreach ($n in 'obs-virtualcam-module64.dll','placeholder.png') {
            $e = $z.Entries | Where-Object FullName -eq "data/obs-plugins/win-dshow/$n"
            [IO.Compression.ZipFileExtensions]::ExtractToFile($e, "$dst\$n", $true)
          }
          $z.Dispose()
          $dll = "$dst\obs-virtualcam-module64.dll"
          if ((Get-FileHash $dll).Hash -ne $env:OBS_DLL_SHA256) { throw 'dll hash mismatch' }
          # /s is not optional: without it regsvr32 shows a dialog and the job hangs.
          $p = Start-Process regsvr32 -ArgumentList "/n /i /s `"$dll`"" -Wait -PassThru -Verb RunAs
          if ($p.ExitCode -ne 0) { throw "regsvr32 exit $($p.ExitCode)" }
          if (-not (Test-Path 'Registry::HKEY_CLASSES_ROOT\CLSID\{A3FCE0F5-3493-419F-958A-ABA1250EC20B}')) { throw 'not registered' }
          Get-ChildItem 'Registry::HKEY_CLASSES_ROOT\CLSID\{860BB310-5D01-11D0-BD3B-00A0C911CE86}\Instance' |
            ForEach-Object { (Get-ItemProperty $_.PSPath).FriendlyName }
      - name: Camera tests that need no camera
        run: python -m pytest -q tests/test_dshow.py tests/test_sweep.py
      # What OpenCV itself makes of the device, with its own video I/O
      # logging on. Kept in the log on purpose: when the virtual-camera
      # tests fail, this is the step that says why.
      - name: Probe OpenCV against the virtual camera
        shell: pwsh
        continue-on-error: true
        env:
          OPENCV_VIDEOIO_DEBUG: "1"
          OPENCV_LOG_LEVEL: "DEBUG"
        run: |
          $ready = "$env:RUNNER_TEMP\probe.ready"
          $p = Start-Process python -ArgumentList "tools\wincam_producer.py `"$ready`"" -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 30 -and -not (Test-Path $ready); $i++) { Start-Sleep 1 }
            Start-Sleep 1
            python tools/wincam_probe.py
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Producer and the virtual-camera tests
        shell: pwsh
        env:
          DARLASTON_WINCAM: "1"
        run: |
          $ready = "$env:RUNNER_TEMP\wincam.ready"
          $p = Start-Process python -ArgumentList "tools\wincam_producer.py `"$ready`"" -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\producer.out" -RedirectStandardError "$env:RUNNER_TEMP\producer.err"
          try {
            for ($i = 0; $i -lt 30 -and -not (Test-Path $ready); $i++) { Start-Sleep 1 }
            if (-not (Test-Path $ready)) { Get-Content "$env:RUNNER_TEMP\producer.err"; throw 'producer not ready' }
            Start-Sleep 1
            python -m pytest -q -m wincam tests/test_wincam.py
            if ($LASTEXITCODE -ne 0) { throw "pytest failed ($LASTEXITCODE)" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      # Our own title bar, on a real window handle: the native platform
      # plugin, not offscreen, because the caption buttons are answered
      # through non-client messages that only a real HWND receives.
      - name: The window frame on a real HWND
        env:
          DARLASTON_WINFRAME: "1"
          # conftest forces offscreen unless this is already set, and
          # offscreen hands out window ids that are not windows. The
          # first run of this test passed two of its three rungs against
          # a handle GetWindowRect said was nothing.
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q -m wincam tests/test_winframe.py
      - name: What the listing says on this machine
        env:
          DARLASTON_WINCAM: "1"
        run: darlaston --list-cameras
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm is not in use, but a shallow clone still hides
          # tags, and the release job below reads them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the artifacts are installable and complete
        run: |
          python -m pip install twine
          twine check dist/*
          # A wheel that quietly ships spike data or test fixtures is a
          # wheel nobody notices is 300 MB until they install it.
          python - <<'PY'
          import glob, zipfile
          w = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(w).namelist()
          stray = [n for n in names
                   if n.startswith(("spike/", "tests/", "tools/"))]
          assert not stray, f"wheel carries files it should not: {stray}"
          assert any("LICENSE" in n for n in names), "no licence in the wheel"
          # The interface is not all Python, and a wheel missing these
          # installs a program that cannot build its own stylesheet. It
          # shipped that way once, because everybody testing it had a
          # clone, where the files are present whether packaged or not.
          fonts = [n for n in names if "/fonts/" in n]
          icons = [n for n in names if "/icons/" in n]
          assert len(fonts) >= 6, f"wheel is missing typefaces: {fonts}"
          assert len(icons) >= 6, f"wheel is missing icons: {icons}"
          print(f"{w}: {len(names)} entries, clean")
          PY

      # Installed, not cloned. Every check above reads the archive; this one
      # asks the program whether it can actually dress itself, from the same
      # position a stranger running `pip install darlaston` is in.
      - name: The installed wheel can build its own interface
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          QT_QPA_PLATFORM=offscreen /tmp/fresh/bin/python - <<'PY'
          from PySide6 import QtWidgets
          from darlaston.ui import icons, theme
          app = QtWidgets.QApplication([])
          theme.install(app)
          fams = theme.load_fonts()
          assert fams["display"] != fams["sans"], f"wordmark missing: {fams}"
          assert fams["mono"] != "monospace", f"body faces missing: {fams}"
          assert len(theme.stylesheet()) > 1000, "the stylesheet came out empty"
          assert len(icons.available()) >= 6, icons.available()
          theme.identify(app)
          assert not app.windowIcon().isNull(), "no application icon"
          print("installed interface builds:", fams)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
